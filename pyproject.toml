[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fox-soroush-bot"
version = "0.1.0"
description = "A safe, queue-driven Soroush Plus moderation bot"
requires-python = ">=3.11"
dependencies = [
  "splusthon>=1.1.4,<1.2",
  "persiantools>=6.0,<7",
]

[project.scripts]
fox-soroush-bot = "foxbot.runtime:main"
fox-soroush-login = "foxbot.login:main"

[project.optional-dependencies]
test = ["pytest>=8.0", "ruff>=0.14"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
